<svg viewBox="0 0 890 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pipeline: untagged tracks are scanned by whisper.cpp, checked against the auto gates, and tagged by mkvpropedit; gate failures go to an interactive confirmation card; every tag lands in the ledger">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g stroke="#d0d7de" stroke-width="1" fill="#f6f8fa">
    <rect x="450" y="8" width="150" height="48" rx="6" stroke-dasharray="4 3"/>
    <rect x="20" y="80" width="170" height="64" rx="6"/>
    <rect x="220" y="80" width="180" height="64" rx="6"/>
    <rect x="680" y="80" width="190" height="64" rx="6"/>
    <rect x="685" y="200" width="190" height="64" rx="6"/>
  </g>
  <g stroke="#54aeff" stroke-width="1" fill="#ddf4ff">
    <rect x="430" y="80" width="190" height="64" rx="6"/>
    <rect x="410" y="200" width="240" height="64" rx="6"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">
    <text x="525" y="28">Sonarr / Radarr</text>
    <text x="105" y="106">untagged tracks</text>
    <text x="310" y="106">whisper.cpp scan</text>
    <text x="525" y="106">auto gates</text>
    <text x="775" y="106">mkvpropedit</text>
    <text x="530" y="226">confirmation card</text>
    <text x="780" y="226">tag ledger</text>
  </g>
  <g font-size="12" fill="#656d76" text-anchor="middle">
    <text x="525" y="44">original language</text>
    <text x="105" y="124">queue, paths, sweeps</text>
    <text x="310" y="124">guesses the language</text>
    <text x="525" y="124">seven checks, listed below</text>
    <text x="775" y="124">header edit, no remux</text>
    <text x="530" y="244">one key per decision</text>
    <text x="780" y="244">append-only, --undo reverts</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M190 112 H218"/>
    <path d="M400 112 H428"/>
    <path d="M620 112 H678"/>
    <path d="M525 56 V78" stroke-dasharray="4 3"/>
    <path d="M525 144 V198"/>
    <path d="M630 200 V170 H730 V146"/>
    <path d="M775 144 V198"/>
  </g>
  <g font-size="11" fill="#656d76">
    <text x="649" y="106" text-anchor="middle">passes</text>
    <text x="533" y="176">held back</text>
    <text x="680" y="164" text-anchor="middle">confirmed</text>
    <text x="783" y="176">every tag</text>
  </g>
</svg>
