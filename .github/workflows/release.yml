# Publishes a GitHub release for every pushed v* tag, with the script attached,
# so the README's releases/latest/download URL always serves a tagged build
# rather than whatever is on main. A tag with a hyphen (v1.9.0-beta.1) becomes a
# pre-release, which `latest` skips. The tag has to match `--version`, or the
# release would serve a file that names a different version than its URL.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Tag matches --version
        run: |
          want="audio-lang-tagger.py ${GITHUB_REF_NAME#v}"
          got="$(python3 audio-lang-tagger.py --version)"
          if [ "$got" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but --version prints '$got'"
            exit 1
          fi
      - run: python3 -m unittest discover -s tests -v
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves the tag lightweight; fetch the annotated one so
          # --notes-from-tag has a message to read.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" audio-lang-tagger.py \
            --title "$GITHUB_REF_NAME" --verify-tag --notes-from-tag "${pre[@]}"
