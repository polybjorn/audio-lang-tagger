# Smoke gate on the media runner (python label -> python:3.12). Stdlib-only
# suite: the script imports and parses, and the pure decision logic (auto
# gates, coherence floor, ledger replay) holds. Deploys go through
# the dotfiles version pin, so a red run here flags a broken main before a
# pin bump ships it to the fleet.
#
# check-attribution.sh gates AI attribution trailers/lines in commit messages
# and PR descriptions. CLAUDE.md says not to add these; an agent has followed
# a conflicting session-level instruction and added them anyway more than
# once regardless. Also enforced by memory alone until this, and memory
# alone did not hold.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: python
    steps:
      # Manual checkout: actions/checkout is a Node action and the python
      # image has no node. git is in the image.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git fetch -q --depth 1 "${GITHUB_SERVER_URL/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: python3 -m unittest discover -s tests -v

  attribution:
    runs-on: python
    steps:
      # Same manual-checkout constraint as the test job, but here we need
      # full history plus the PR base ref (when there is one) so the range
      # check has something to diff against.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="${GITHUB_SERVER_URL/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${GITHUB_REPOSITORY}.git"
          git init -q .
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q "$url" \
              "$GITHUB_SHA:refs/heads/pr-head" \
              "${{ github.event.pull_request.base.ref }}:refs/heads/pr-base"
            git checkout -q pr-head
          else
            git fetch -q "$url" "$GITHUB_SHA"
            git checkout -q FETCH_HEAD
          fi
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./check-attribution.sh commits pr-base..pr-head
          else
            # A push carries the range it added; read that, not just the tip.
            # On main the tip is a merge commit, which carries none of the
            # trailers its parents do, so `-1` reported success on a push that
            # had just landed one (polybjorn-en, 2026-09-13).
            #
            # Fallbacks, narrowest first: $before is missing (a runner that
            # does not hand it over), zeroed (first push to the branch) or no
            # longer in history (a rewrite), so use the side that was merged
            # in; and for a root commit with no parent at all, the tip alone,
            # which is what the old form did.
            range=-1
            if git rev-parse -q --verify "$AFTER^1^{commit}" >/dev/null; then
              range="$AFTER^1..$AFTER"
            fi
            if [ -n "${BEFORE:-}" ] \
              && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
              range="$BEFORE..$AFTER"
            fi
            echo "checking range: $range"
            ./check-attribution.sh commits "$range"
          fi
      - name: Check PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          ./check-attribution.sh body /tmp/pr-body.txt

  # Liveness for the branch sweep in delete-merged-branch.yml. That sweep is the
  # backstop for a merge whose delete event never arrived, and it has the same
  # blind spot one layer up: if its timer stops firing, branches pile up in
  # exactly the same silence, because the absence of a run looks identical to
  # nothing to do.
  #
  # It lives here rather than on a schedule of its own because a watchdog on its
  # own timer needs its own watchdog. Every merge pushes to main, so this fires
  # exactly when a branch would just have been left behind, and it costs no
  # runner slot of its own. rovar-no reaches the same arrangement through a
  # merge-audit workflow it already had; this repo has no npm and no second
  # daily job, so ci.yml is the one that runs anyway.
  sweep-freshness:
    # Never on a pull_request: the thing it watches is a property of main, and a
    # PR going red for an infrastructure fault it did not cause is how a gate
    # gets ignored. workflow_dispatch is allowed so it can be run by hand.
    if: github.event_name != 'pull_request'
    runs-on: python
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git fetch -q --depth 1 "${GITHUB_SERVER_URL/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # Lengths only, and before the work rather than after. The values must
      # never reach a log, which is readable by anyone who can read the repo.
      # A job that cannot reach the API should say so in its first seconds
      # rather than looking like a clean check, which is exactly the failure
      # mode this job exists to remove.
      #
      # FORGE_PR_TOKEN is an Actions secret at the user scope of the repo owner.
      # MEASURED on this job's first run on main (task 2185, 2026-09-16): it
      # resolves here too, 40 characters, so this repo joins nixfleet,
      # lokalverket-no, rovar-no and polybjorn-en. The same run settled the
      # question that actually matters - the automatic token read the Actions
      # listing on its own and the fallback below was never reached. Keep the
      # fallback anyway: it costs nothing on the path that works, and the run
      # that needs it is the one where something has already changed.
      - name: Which tokens are available
        env:
          AUTO: ${{ github.token }}
          PR_TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -u
          echo "github.token:    ${#AUTO} characters"
          echo "FORGE_PR_TOKEN:  ${#PR_TOKEN} characters"

      - name: The branch sweep is still running
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          AUTO: ${{ github.token }}
          PR_TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -u
          # Prefer the automatic token: fewer dependencies, and it is the one
          # that is always there. Confirmed sufficient here on 2026-09-16 -
          # rovar-no needs FORGE_PR_TOKEN for the same listing and this repo
          # does not, which is why this order is a preference and not a
          # fallback chain to be simplified away. If the automatic one is ever
          # refused the script exits 2 and this retries rather than reporting a
          # missing sweep - "could not tell" and "not running" are different
          # facts.
          #
          # `|| status=$?` rather than an `if`: after an untaken if-branch bash
          # resets $? to 0, so reading the status after `fi` would turn a real
          # exit 1 into a fallback attempt and possibly a pass. Measured, not
          # assumed - `if (exit 1); then :; fi; echo $?` prints 0.
          status=0
          TOKEN="$AUTO" ./check-sweep-freshness.py || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          if [ -z "${PR_TOKEN:-}" ]; then
            echo "the automatic token could not read the Actions listing and" >&2
            echo "FORGE_PR_TOKEN is not visible to this repo, so the sweep's" >&2
            echo "liveness cannot be checked at all. It is a user-scope Actions" >&2
            echo "secret on the repo owner; a repo-level secret of the same name" >&2
            echo "would shadow it." >&2
            exit "$status"
          fi
          echo "the automatic token was refused; retrying with FORGE_PR_TOKEN" >&2
          TOKEN="$PR_TOKEN" ./check-sweep-freshness.py
